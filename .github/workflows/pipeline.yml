name: Pipeline

on:
  schedule:
    # 2x/day per the pull-budget design; offset minutes to dodge the
    # top-of-hour congestion window where GitHub delays cron jobs.
    - cron: "17 5,17 * * *"
  workflow_dispatch:

# One pipeline at a time; a late cron never races a manual run.
concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The orphan data branch checks out INTO data/ — bronze and the DB
      # live there, never on main (git-history-bloat red-team finding).
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Ingest (incremental auto window)
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python -m gridpulse ingest
      - run: python -m gridpulse transform
      - run: python -m gridpulse derive
      - run: python -m gridpulse report --out _site/index.html
      - name: Commit data branch
        run: |
          cd data
          git config user.name "gridpulse-pipeline"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "data: scheduled run $(date -u +%FT%H:%MZ)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
